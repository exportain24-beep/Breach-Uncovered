name: SEO and performance report
on:
  schedule:
    - cron: "17 3 * * 0"        # every Sunday 03:17 UTC; the weekly Claude SEO audit reads reports/seo-report.md
  workflow_dispatch:
  push:
    paths: ["tools/.seo-report-now"]
permissions:
  contents: write
concurrency:
  group: breach-seo-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Build report
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_SYSTEM_USER_TOKEN: ${{ secrets.FB_SYSTEM_USER_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 tools/seo_report.py
      - name: Save report
        if: always()
        run: |
          git config user.name "breach-bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/seo-report.md || true
          git commit -m "SEO report [skip ci]" || true
          git pull --rebase -q || true
          git push || true

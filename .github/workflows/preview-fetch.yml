name: Fetch preview artifact into repo
on:
  push:
    paths: ["shorts3d/.fetch-run"]     # first line = run id whose short-preview artifact to compress and commit
permissions:
  contents: write
  actions: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: rid
        run: echo "id=$(head -n1 shorts3d/.fetch-run | tr -dc 0-9)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { name: short-preview, run-id: "${{ steps.rid.outputs.id }}", github-token: "${{ github.token }}", path: art }
      - name: Compress (< 50 MB) and commit to previews/
        run: |
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update -y -q && sudo apt-get install -y -q ffmpeg)
          mkdir -p previews; f=$(ls art/*.mp4 | head -1)
          ffmpeg -y -v error -i "$f" -c:v libx264 -preset slow -crf 24 -maxrate 6M -bufsize 12M -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart previews/short-preview.mp4
          ls -la previews
          git config user.name "breach-bot"; git config user.email "actions@users.noreply.github.com"
          git add previews; git commit -m "3D short preview [skip ci]" -q; git pull --rebase -q; git push

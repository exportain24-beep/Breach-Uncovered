name: Daily episode
on:
  push:
    paths: ["tools/.run-now"]   # first-video kick-off: pushing this file builds and publishes the next episode ~15 min after upload
  schedule:
    - cron: "0 13 * * *"   # builds + schedules the 17:00 UTC slot (23:00 Bangladesh = US lunch / UK evening)
    - cron: "0 19 * * *"   # builds + schedules the 23:00 UTC slot (05:00 Bangladesh = US evening)
  workflow_dispatch:
    inputs:
      episode: { description: "Force a specific episode number (optional)", required: false }
      dry_run: { description: "Build only, upload nothing (true/false)", required: false, default: "false" }
permissions:
  contents: write
concurrency:
  group: breach-daily
  cancel-in-progress: false
jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System + Python deps
        run: |
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
          pip install numpy scipy pillow opencv-python-headless requests
      - uses: actions/cache@v4
        with:
          path: cache/media
          key: media-${{ github.run_id }}
          restore-keys: media-
      - name: Build + upload next episode
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_SYSTEM_USER_TOKEN: ${{ secrets.FB_SYSTEM_USER_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.episode }}" ] && ARGS="$ARGS --episode ${{ github.event.inputs.episode }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry"
          [ "${{ github.event_name }}" = "push" ] && ARGS="$ARGS --now --episode $(tr -dc 0-9 < tools/.run-now)"
          mkdir -p reports; set -o pipefail; python3 tools/run_episode.py $ARGS 2>&1 | tee reports/last-run.log | tail -n 400
      - name: Save state
        if: always()
        run: |
          git config user.name "breach-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/state.json reports/last-run.log || true
          git commit -m "Update publishing state [skip ci]" || true
          git pull --rebase -q || true
          git push || true
      - name: Keep the rendered video for 3 days (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            out/*.mp4
            work/*/thumb.jpg
            work/*/youtube.json
          retention-days: 3
          if-no-files-found: ignore

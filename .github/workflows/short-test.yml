name: 3D short (preview)
on:
  push:
    paths: ["shorts3d/.test-now"]      # first line = path of the short script, e.g. shorts/001-bangladesh.json
  workflow_dispatch:
    inputs:
      script: { description: "Short script path", required: false, default: "shorts/001-bangladesh.json" }
permissions:
  contents: write
concurrency:
  group: breach-short-preview
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Deps (python, ffmpeg, headless Chromium for WebGL)
        run: |
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
          pip install numpy scipy pillow opencv-python-headless requests playwright
          python -m playwright install --with-deps chromium
      - name: Render the 3D short (real voice)
        timeout-minutes: 90
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          S="${{ github.event.inputs.script }}"
          [ -z "$S" ] && S="$(head -n1 shorts3d/.test-now | tr -d '\r ')"
          mkdir -p out reports; set -o pipefail
          python3 -u shorts3d/make_short.py "$S" out/short-preview.mp4 --workdir work/short 2>&1 | tee reports/short-run.log | tail -n 200
      - name: Publish preview to the previews branch (so it can be fetched and watched)
        if: always()
        run: |
          git config user.name "breach-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/pv; cp out/short-preview.mp4 /tmp/pv/ 2>/dev/null || true; cp reports/short-run.log /tmp/pv/ 2>/dev/null || true
          git checkout --orphan previews-tmp; git rm -rf . -q; cp /tmp/pv/* . ; git add -A; git commit -m "3D short preview [skip ci]" -q || true
          git push -f origin HEAD:previews || true
